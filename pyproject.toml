[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-maintainer-audit"
version = "0.1.0"
description = "Audit, update, classify, and visualize local AI agent skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kiaarryy" }]
dependencies = []

[project.scripts]
skill-maintainer-audit = "skill_maintainer_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

